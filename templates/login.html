{% extends 'base.html' %}

{% block title %}Projet IAM — Connexion{% endblock %}

{% block content %}
<main id="main-content" class="main-content">
    <div class="container auth-page">
        <section class="rx-section-block auth-panel">
            <h1 class="workspace-title">Connexion</h1>
            <form method="post" class="rx-form-grid rx-form-grid--single">
                <label class="rx-field"><span>Email</span><input name="email" type="email" required autocomplete="email"></label>
                <label class="rx-field"><span>Mot de passe</span><input name="password" type="password" required autocomplete="current-password"></label>
                <div class="form-actions">
                    <a href="/inscription" class="btn btn-secondary">Demander un compte</a>
                    <button type="submit" class="btn btn-primary">Se connecter</button>
                </div>
            </form>
        </section>
    </div>
</main>
{% endblock %}
