{% extends 'base.html' %}

{% block title %}Projet IAM — Demande de compte{% endblock %}

{% block content %}
<main id="main-content" class="main-content">
    <div class="container auth-page">
        <section class="rx-section-block auth-panel">
            <h1 class="workspace-title">Demande de compte prescripteur</h1>
            <form method="post" class="rx-form-grid">
                <label class="rx-field"><span>Prénom</span><input name="first_name" type="text" required></label>
                <label class="rx-field"><span>Nom</span><input name="last_name" type="text" required></label>
                <label class="rx-field"><span>Email</span><input name="email" type="email" required autocomplete="email"></label>
                <label class="rx-field"><span>Mot de passe</span><input name="password" type="password" required minlength="8" autocomplete="new-password"></label>
                <div class="form-actions rx-field--wide">
                    <a href="/connexion" class="btn btn-secondary">Connexion</a>
                    <button type="submit" class="btn btn-primary">Envoyer la demande</button>
                </div>
            </form>
        </section>
    </div>
</main>
{% endblock %}
